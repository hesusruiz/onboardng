<!DOCTYPE html>
<html lang="en">

<head>
    <title>AdminReg</title>
    <link rel="stylesheet" href="assets/w3.css" />
    <link rel="stylesheet" href="assets/dome.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Blinker:wght@100;200;300;400;600;700;800;900&family=Caladea:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=check_circle,counter_1,counter_2,counter_3" />

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.es5.umd.min.js"></script>

</head>

<body>
    <header>
        <div class="dome-header">
            <div class="dome-content">
                <div class="w3-bar">
                    <div class="w3-bar-item padding-right-0">
                        <a href="#">
                            <img src="assets/logos/DOME_Icon_White.svg" alt="DOME Icon"
                                style="width:100%;max-height:32px">
                        </a>
                    </div>
                    <div class="w3-bar-item">
                        <span class="blinker-semibold w3-xlarge nowrap">DOME Onboarding Admin</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div style="background-color: #EDF2FA; min-height: 100vh;">
            <div class="w3-padding-32 dome-content">

                <h2>Register as admin</h2>

                <button onclick="startRegister('12345')" class="w3-button w3-round-large w3-blue">Register
                    Passkey</button>

            </div>
        </div>
    </main>

    <footer>
        <div class="dome-content">
        </div>
    </footer>


    <script type="module">
        import { checkPasskeySupport, createPasskeyRaw } from "./assets/js/passkeys.js"

        let available = await checkPasskeySupport()

        async function startRegister(token) {
            debugger;
            const res = await fetch('/api/register/begin?t=' + token);
            const resJSON = await res.json();

            const publicKey = resJSON.publicKey
            publicKey.pubKeyCredParams = [
                { alg: -7, type: "public-key" }, // ES256
                { alg: -257, type: "public-key" }, // RS256
            ]

            let attestation;
            try {
                // Pass the options to the authenticator and wait for a response
                attestation = await SimpleWebAuthnBrowser.startRegistration(publicKey);
            } catch (error) {
                // Some basic error handling
                if (error.name === 'InvalidStateError') {
                    alert('Error: Authenticator was probably already registered by user');
                } else {
                    alert(error);
                }

                throw error;
            }

            await fetch('/api/register/finish?t=' + token, {
                method: 'POST',
                body: JSON.stringify(attestation)
            });
            alert("Registration successful!");
            window.location.href = "/login";
        }

        window.startRegister = startRegister

    </script>


</body>

</html>
